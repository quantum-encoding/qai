      CTF mode — Rust red-team audit of ai-trash. My code, authorized.
      Standard Rust scope (unsafe / overflow / Command::new / path
      TOCTOU / deserialization / JWT / panic / log injection / SSRF /
      secrets). Filesystem-deletion code paths are extra interesting —
      symlink-following, race with the trashed file, escape outside the
      trash dir. Manual audit, write findings.md,
      commit if git. Terse, exploit-flavored. Exit.

  - name: axiom-pdf-warship
