# rust-ctf.yaml — 15-agent red-team mission across recent Rust programs.

version: 1

defaults:
  startup_timeout: 45s
  reporting:
    enabled: true

panes:
  - name: eye-of-metatron
    cwd: /Users/director/work/rust_programs/eye-of-metatron
    agent: { kind: fresh, cmd: claude, args: ["--permission-mode", "auto"] }
    prompt: |
      CTF mode — Rust red-team audit of eye-of-metatron. My code, authorized.
      Steps: (1) read enough source to understand what it is + threat model;
      (2) manually audit unsafe blocks, integer overflow on attacker sizes
      (release wraps in Rust if -C overflow-checks=off), Command::new
      injection, path TOCTOU + missing O_NOFOLLOW, deserialization (serde
      untrusted), JWT/auth/TLS, panic-on-input (unwrap/expect on parsed
      data), log injection, SSRF in reqwest, secrets in logs/argv/env.
      (3) Write findings.md at project root with severity (crit/high/med/
      low/info), file:line, description, exploit sketch, fix. (4) If git
      repo, commit findings.md. Be terse, exploit-flavored, no fluff.
      Then exit.

  - name: secret_cli
    cwd: /Users/director/work/rust_programs/secret_cli
    agent: { kind: fresh, cmd: claude, args: ["--permission-mode", "auto"] }
    prompt: |
      CTF mode — Rust red-team audit of secret_cli. My code, authorized.
      Same scope as the standard Rust threat list (unsafe, overflow,
      Command::new, path TOCTOU, deserialization, JWT, panic-on-input,
      log/SSRF, secrets in logs/argv/env). Pay extra attention to how
      secrets are stored and accessed (this is a secrets-handling tool).
      Manual deep-read of entry + secret access path.
      Write findings.md, commit if git. Terse, exploit-flavored. Exit.

  - name: ai-trash
